name: Build & Test

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.py'
      - '**.yml'

permissions:
  contents: read

jobs:
  test-ubuntu:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      # 1. 语法检查
      - name: Syntax check
        run: python -m py_compile Main.py Include/Base.py Library/Base.py Library/Runner.py Scripts/KeyPress.py Scripts/MouseClick.py Scripts/Recorder.py

      # 2. 导入/运行测试 (跳过):
      #    a. pyautogui 在 Linux import 时即连接 X display (runner 无桌面跑不了)
      #    b. 若 Xvfb 虚拟显示, 运行报错

      # 3. PyInstaller 打包
      - name: Build executable
        run: pyinstaller --onefile --name AutoGui --add-data "Scripts:Scripts" Main.py

  test-windows:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      # 1. 语法检查（Windows runner 的 pwsh 不做外部命令参数 glob，显式列全文件）
      - name: Syntax check
        run: python -m py_compile Main.py Include/Base.py Library/Base.py Library/Runner.py Scripts/KeyPress.py Scripts/MouseClick.py Scripts/Recorder.py

      # 2. 导入/运行测试
      - name: Import check
        run: python -c "import Main; print('IMPORT_OK')"

      # 2b. 导出白名单守护：模拟脚本的 import *，断言不引入外部依赖/包名（各模块 __all__ 是唯一白名单）
      # 注：值含冒号+空格，须用块标量避免 YAML 解析为 mapping
      - name: Export whitelist check
        run: >-
          python -c "g={}; exec('from Include.Base import *\nfrom Library.Base import *\nfrom Library.Runner import *', g); leaked=[n for n in g if n in ('pyautogui','time','json','os','threading','sys','pynput','argparse','dataclasses','Library','Include','Base','Runner')]; assert not leaked, 'unexpected exports: %s' % leaked; print('EXPORT_OK')"

      - name: Version check
        shell: bash
        run: |
          python Main.py --version
          python Scripts/KeyPress.py -v
          python Scripts/Recorder.py -v

      - name: Run KeyPress standalone
        shell: bash
        run: python Scripts/KeyPress.py -l f13 -r 1 -d 0 -a

      - name: Run MouseClick standalone
        shell: bash
        run: python Scripts/MouseClick.py -l 1 -r 1 -a -d 0

      - name: Run Recorder replay standalone
        shell: bash
        run: |
          printf '{"version": 1, "events": [{"t": 0.0, "type": "keydown", "key": "f13"}, {"t": 0.05, "type": "keyup", "key": "f13"}]}' > one_rec.json
          python Scripts/Recorder.py replay one_rec.json -a -r 1

      # 3. PyInstaller 打包冒烟：构建后跑真实功能，验证 Scripts 数据打包 + frozen 模式功能可用
      - name: Build executable
        run: pyinstaller --onefile --name AutoGui --add-data "Scripts:Scripts" Main.py

      - name: Run executable (keypress)
        shell: bash
        run: ./dist/AutoGui.exe keypress -l f13 -r 1 -d 0 -a

      - name: Run executable (replay)
        shell: bash
        run: |
          printf '{"version": 1, "events": [{"t": 0.0, "type": "keydown", "key": "f13"}, {"t": 0.05, "type": "keyup", "key": "f13"}]}' > one_rec.json
          ./dist/AutoGui.exe replay one_rec.json -a -r 1
